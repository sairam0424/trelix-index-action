name: trelix index
description: Index a repository with trelix for AI-powered code search
author: sairam0424
branding:
  icon: search
  color: green
inputs:
  repo-path:
    description: Path to repo
    default: "."
    required: false
  provider:
    description: "local|openai|azure|voyage"
    default: local
    required: false
outputs:
  index-path:
    description: Path to .trelix/index.db
    value: "${{ steps.index.outputs.index-path }}"
runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: "3.11"
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: "${{ inputs.repo-path }}/.trelix/"
        key: "trelix-index-${{ github.sha }}"
    - shell: bash
      run: pip install "trelix[local]>=0.4.0" -q
    - id: index
      shell: bash
      env:
        REPO_PATH: ${{ inputs.repo-path }}
        PROVIDER: ${{ inputs.provider }}
      run: |
        trelix index "${GITHUB_WORKSPACE}/${REPO_PATH}" --provider "${PROVIDER}"
        echo "index-path=${GITHUB_WORKSPACE}/${REPO_PATH}/.trelix/index.db" >> "$GITHUB_OUTPUT"
